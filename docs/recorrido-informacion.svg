<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Recorrido de la información del sistema de seguimiento de obras</title>
<desc>Tres fuentes (el DT por el bot, la oficina y MS Project) cargan la base de datos del VPS; el motor de alertas la revisa y alimenta el panel, el mail diario, el aviso por el bot y el informe semanal. Verde: hecho. Ámbar: parcial o solo en la demo. Gris: falta.</desc>
<defs>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.fondo{fill:#ffffff}
.tit{font-size:16px;font-weight:600;fill:#1d1d1b}
.sub{font-size:12px;fill:#6c6a63}
.h{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.s{font-size:12px;text-anchor:middle;dominant-baseline:central}
.l{font-size:12px;fill:#444441;dominant-baseline:central}
.ok rect{fill:#EAF3DE;stroke:#3B6D11}.ok .h{fill:#27500A}.ok .s{fill:#3B6D11}
.parcial rect{fill:#FAEEDA;stroke:#854F0B}.parcial .h{fill:#633806}.parcial .s{fill:#854F0B}
.falta rect{fill:#F1EFE8;stroke:#5F5E5A}.falta .h{fill:#444441}.falta .s{fill:#5F5E5A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
</defs>
<rect class="fondo" x="0" y="0" width="680" height="610" rx="12"/>
<text class="tit" x="40" y="34">Recorrido de la información</text>
<text class="sub" x="40" y="54">Estado al 15/10/2026</text>

<g class="ok"><rect x="40" y="80" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="130" y="98">DT en obra</text><text class="s" x="130" y="118">Manda por Telegram</text></g>
<g class="parcial"><rect x="250" y="80" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="340" y="98">Oficina</text><text class="s" x="340" y="118">Formularios en la demo</text></g>
<g class="parcial"><rect x="460" y="80" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="550" y="98">MS Project</text><text class="s" x="550" y="118">El bot ya lee el CSV</text></g>

<g class="ok"><rect x="40" y="176" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="130" y="194">Bot de reporte</text><text class="s" x="130" y="214">Funciona en Telegram</text></g>

<g class="parcial"><rect x="140" y="272" width="400" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="340" y="290">Base de datos en el VPS</text><text class="s" x="340" y="310">Existe la del bot; faltan tablas del panel</text></g>

<g class="parcial"><rect x="190" y="368" width="300" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="340" y="386">Motor de alertas</text><text class="s" x="340" y="406">Reglas listas, corren en la demo</text></g>

<g class="parcial"><rect x="40" y="464" width="135" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="107" y="482">Panel</text><text class="s" x="107" y="502">Demo publicada</text></g>
<g class="falta"><rect x="195" y="464" width="135" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="262" y="482">Mail diario</text><text class="s" x="262" y="502">Falta</text></g>
<g class="falta"><rect x="350" y="464" width="135" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="417" y="482">Aviso por bot</text><text class="s" x="417" y="502">Falta</text></g>
<g class="parcial"><rect x="505" y="464" width="135" height="56" rx="8" stroke-width="0.8"/>
<text class="h" x="572" y="482">Informe semanal</text><text class="s" x="572" y="502">Sin PDF todavía</text></g>

<line class="arr" x1="130" y1="136" x2="130" y2="174" marker-end="url(#flecha)"/>
<path class="arr" d="M130 232 L130 300 L138 300" marker-end="url(#flecha)"/>
<line class="arr" x1="340" y1="136" x2="340" y2="270" marker-end="url(#flecha)"/>
<path class="arr" d="M550 136 L550 300 L542 300" marker-end="url(#flecha)"/>
<line class="arr" x1="340" y1="328" x2="340" y2="366" marker-end="url(#flecha)"/>
<path class="arr" d="M340 424 L340 444 M107 444 L572 444"/>
<line class="arr" x1="107" y1="444" x2="107" y2="462" marker-end="url(#flecha)"/>
<line class="arr" x1="262" y1="444" x2="262" y2="462" marker-end="url(#flecha)"/>
<line class="arr" x1="417" y1="444" x2="417" y2="462" marker-end="url(#flecha)"/>
<line class="arr" x1="572" y1="444" x2="572" y2="462" marker-end="url(#flecha)"/>

<g class="ok"><rect x="40" y="556" width="16" height="16" rx="4" stroke-width="0.8"/></g>
<text class="l" x="64" y="564">Hecho y funcionando</text>
<g class="parcial"><rect x="230" y="556" width="16" height="16" rx="4" stroke-width="0.8"/></g>
<text class="l" x="254" y="564">Parcial o solo en la demo</text>
<g class="falta"><rect x="450" y="556" width="16" height="16" rx="4" stroke-width="0.8"/></g>
<text class="l" x="474" y="564">Falta</text>
</svg>
